@for (
  lake of lakes();
  track lake.name;
  let even = $even;
  let odd = $odd;
  let count = $count;
  let first = $first;
  let last = $last
  ) {
  @if (first) {
    <p>Total lakes: {{ count }}</p>
  }

  <app-content-list-item
    [lake]="lake"
    [class.even]="even"
    [class.odd]="odd"
    (remove)="removeLake($event)">
  </app-content-list-item>

  @if (last) {
    <p>End of lake list.</p>
  }
} @empty {
  <p>No lakes were found.</p>
}
